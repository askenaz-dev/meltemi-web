name: Deploy

# Only the current, CI-approved main SHA reconciles production. IDE notices use the same gate.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful push/main CI run; omitted IDE notices resolve current main CI
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # Shared with infra-apply: Wrangler must not change Worker metadata during its saved plan/apply.
  group: production-reconciliation
  cancel-in-progress: false
  queue: max

jobs:
  source:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      current: ${{ steps.ci.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .automation
          persist-credentials: false
      - name: Validate CI and resolve current main for an IDE notice
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          ALLOW_CURRENT: "true"
        run: node .automation/scripts/ci-source.mjs resolve

  deploy:
    needs: source
    if: needs.source.outputs.current == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .automation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: The identity Worker's configuration, with the ids Terraform gave
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          SECRETS_STORE_ID: ${{ vars.SECRETS_STORE_ID }}
        run: node scripts/deploy-config.mjs packages/identity/wrangler.jsonc
      - name: Refuse to deploy superseded source
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: node ../.automation/scripts/ci-source.mjs current
      - name: Identity migrations
        if: steps.current.outputs.current == 'true'
        working-directory: source/packages/identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote -c wrangler.deploy.json
      - name: Identity Worker
        if: steps.current.outputs.current == 'true'
        working-directory: source/packages/identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy -c wrangler.deploy.json
      - name: The IDE's latest release, written into its pages
        if: steps.current.outputs.current == 'true'
        working-directory: source/packages/site
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ide-release.mjs public
      - name: Family site
        if: steps.current.outputs.current == 'true'
        working-directory: source/packages/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

  # The documentation portal (change docs-portal): after the site, from the same approved source and
  # in the same production queue. The build reads each product's latest release from GitHub and
  # embeds the passages with Workers AI through this job's token; a product whose documentation
  # cannot be read fails the build before anything is uploaded, and the portal stays as it was.
  docs:
    needs: [source, deploy]
    if: needs.source.outputs.current == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .automation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The pictures and embeddings of earlier builds
        uses: actions/cache@v4
        with:
          path: source/packages/docs/.cache
          key: docs-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: docs-cache-
      - name: Refuse to deploy superseded source
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: node ../.automation/scripts/ci-source.mjs current
      - name: The portal, from the products' latest releases
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @meltemi/docs build --from release
      - name: Documentation portal
        if: steps.current.outputs.current == 'true'
        working-directory: source/packages/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

name: Deploy

# Every push to main that changes a Worker: the identity service's migrations, then its code, then
# the family site's files, uploaded with wrangler onto the Workers that Terraform declared
# (packages/infra). This workflow creates nothing and sets no secret: the production environment
# holds what Terraform put there, a deploy token that can only upload Workers and migrate D1, and
# the ids the configuration needs.

on:
  push:
    branches: [main]
    paths:
      - "packages/identity/**"
      - "packages/site/**"
      - "scripts/deploy-config.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      SECRETS_STORE_ID: ${{ vars.SECRETS_STORE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: The identity Worker's configuration, with the ids Terraform gave
        run: node scripts/deploy-config.mjs packages/identity/wrangler.jsonc
      - name: Identity migrations
        working-directory: packages/identity
        run: pnpm exec wrangler d1 migrations apply DB --remote -c wrangler.deploy.json
      - name: Identity Worker
        working-directory: packages/identity
        run: pnpm exec wrangler deploy -c wrangler.deploy.json
      - name: Family site
        working-directory: packages/site
        run: pnpm exec wrangler deploy

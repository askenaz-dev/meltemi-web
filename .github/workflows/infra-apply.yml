name: Infrastructure apply

# Temporary operation branch only. NEVER merge this replacement of main's apply workflow.
# The owner separately supplies the four MCP_TEST_TOKEN inputs in infrastructure.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-reconciliation
  cancel-in-progress: false
  queue: max

jobs:
  apply:
    if: github.repository == 'askenaz-dev/meltemi-web' && github.ref == 'refs/heads/codex/mcp-credentials-bootstrap-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: infrastructure
    defaults:
      run:
        working-directory: source/packages/infra
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_session_private_key: ${{ secrets.SESSION_PRIVATE_KEY }}
      # Four explicit, separately masked inputs. Never substitute a provider/admin credential.
      TF_VAR_mcp_test_tokens: >-
        {"staging": {"token": "${{ secrets.MCP_TEST_TOKEN_STAGING }}", "token_2": "${{ secrets.MCP_TEST_TOKEN_2_STAGING }}"},
        "production": {"token": "${{ secrets.MCP_TEST_TOKEN_PRODUCTION }}", "token_2": "${{ secrets.MCP_TEST_TOKEN_2_PRODUCTION }}"}}
    steps:
      - name: Operation controls at this workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: operation
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify approved current main and the four explicit inputs
        working-directory: operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { resolveSource } from "./scripts/ci-source.mjs";
          import { githubApi } from "./scripts/github-api.mjs";
          const source = await resolveSource(
            githubApi(process.env.GITHUB_REPOSITORY, process.env.GH_TOKEN),
            process.env.GITHUB_REPOSITORY,
            "42252346648",
          );
          if (source.sha !== "f2b1af34fb448f497a6dc741beae74dd94266661" || source.current !== "true") {
            throw new Error("The pinned source is no longer current approved main; review the operation again.");
          }
          console.log("Pinned main source and its successful push CI verified.");
          NODE
          node scripts/mcp-credentials-bootstrap-plan.mjs --inputs
      - name: Existing Terraform declarations from approved main
        uses: actions/checkout@v4
        with:
          ref: f2b1af34fb448f497a6dc741beae74dd94266661
          path: source
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - name: Authenticate the established state backend
        run: |
          answer="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          if [ "$(jq -r '.result.status // empty' <<< "$answer")" != active ]; then
            echo '::error::The infrastructure token is not active.'
            exit 1
          fi
          key_id="$(jq -r '.result.id // empty' <<< "$answer")"
          if [ -z "$key_id" ]; then exit 1; fi
          secret="$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$secret"
          echo "AWS_ACCESS_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"
      - name: Remove incidental repository and environment dependencies
        run: cp "$GITHUB_WORKSPACE/operation/scripts/mcp-credentials-bootstrap-override.tf" mcp_credentials_bootstrap_override.tf
      - name: Initialize pinned providers without an upgrade
        run: |
          terraform init -no-color
          terraform version -json | jq -e '.provider_selections == {
            "registry.terraform.io/cloudflare/cloudflare": "5.28.0",
            "registry.terraform.io/hashicorp/random": "3.9.1",
            "registry.terraform.io/integrations/github": "6.13.0"
          }' > /dev/null
      - name: Refuse to plan after main changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api repos/askenaz-dev/meltemi-web/git/ref/heads/main --jq .object.sha)"
          if [ "$current" != f2b1af34fb448f497a6dc741beae74dd94266661 ]; then
            echo '::error::Main changed; review the operation source and CI again.'
            exit 1
          fi
      - name: Save and validate only the four credential targets
        run: |
          umask 077
          terraform plan -no-color -lock-timeout=5m \
            -target='github_actions_environment_secret.mcp_test_token["meltemi-diagrams/staging/MELTEMI_TOKEN"]' \
            -target='github_actions_environment_secret.mcp_test_token["meltemi-diagrams/staging/MELTEMI_TOKEN_2"]' \
            -target='github_actions_environment_secret.mcp_test_token["meltemi-diagrams/production/MELTEMI_TOKEN"]' \
            -target='github_actions_environment_secret.mcp_test_token["meltemi-diagrams/production/MELTEMI_TOKEN_2"]' \
            -out=mcp-credentials.tfplan
          terraform show -json mcp-credentials.tfplan | node "$GITHUB_WORKSPACE/operation/scripts/mcp-credentials-bootstrap-plan.mjs"
      - name: Refuse to apply after main changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api repos/askenaz-dev/meltemi-web/git/ref/heads/main --jq .object.sha)"
          if [ "$current" != f2b1af34fb448f497a6dc741beae74dd94266661 ]; then
            echo '::error::Main changed after planning; review its source and CI again.'
            exit 1
          fi
      - name: Apply exactly the validated saved plan
        run: terraform apply -no-color -lock-timeout=5m mcp-credentials.tfplan
      - name: Require an unchanged second targeted plan
        run: |
          umask 077
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode \
            -target='github_actions_environment_secret.mcp_test_token["meltemi-diagrams/staging/MELTEMI_TOKEN"]' \
            -target='github_actions_environment_secret.mcp_test_token["meltemi-diagrams/staging/MELTEMI_TOKEN_2"]' \
            -target='github_actions_environment_secret.mcp_test_token["meltemi-diagrams/production/MELTEMI_TOKEN"]' \
            -target='github_actions_environment_secret.mcp_test_token["meltemi-diagrams/production/MELTEMI_TOKEN_2"]' \
            -out=mcp-credentials-verify.tfplan
          code=$?
          set -e
          if [ "$code" != 0 ]; then
            echo '::error::The four credential targets did not converge to an unchanged plan.'
            exit 1
          fi
          terraform show -json mcp-credentials-verify.tfplan | node "$GITHUB_WORKSPACE/operation/scripts/mcp-credentials-bootstrap-plan.mjs" --verify
      - name: Verify four destination metadata records without reading values
        run: |
          for environment in staging production; do
            for name in MELTEMI_TOKEN MELTEMI_TOKEN_2; do
              metadata="$(gh api "repos/askenaz-dev/meltemi-diagrams/environments/$environment/secrets/$name" --jq '{name, updated_at}')"
              if [ "$(jq -r '.name' <<< "$metadata")" != "$name" ]; then exit 1; fi
              jq -c --arg environment "$environment" '. + {environment: $environment}' <<< "$metadata" >> "$GITHUB_STEP_SUMMARY"
            done
          done
      - name: Remove sensitive runner-local operation files
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f source/packages/infra/mcp-credentials.tfplan source/packages/infra/mcp-credentials-verify.tfplan source/packages/infra/mcp_credentials_bootstrap_override.tf

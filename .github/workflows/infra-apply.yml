name: Infrastructure apply

# Temporary operation branch only. Do not merge this replacement of the normal apply workflow.
# Dispatch only after the operator has supplied OVSX_PAT in the infrastructure environment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'askenaz-dev/meltemi-web' && github.ref == 'refs/heads/codex/ovsx-bootstrap-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: infrastructure
    defaults:
      run:
        working-directory: source/packages/infra
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_existing_secrets_store_id: ${{ vars.EXISTING_SECRETS_STORE_ID }}
      TF_VAR_existing_zone_ids: ${{ vars.EXISTING_ZONE_IDS || '{}' }}
      TF_VAR_existing_apex_record_ids: ${{ vars.EXISTING_APEX_RECORD_IDS || '{}' }}
      TF_VAR_session_private_key: ${{ secrets.SESSION_PRIVATE_KEY }}
      TF_VAR_github_client_secret: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      TF_VAR_google_client_secret: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
      TF_VAR_admin_subs: ${{ secrets.ADMIN_SUBS }}
      TF_VAR_npm_token: ${{ secrets.NPM_TOKEN }}
      TF_VAR_vsce_pat: ${{ secrets.VSCE_PAT }}
      TF_VAR_ovsx_pat: ${{ secrets.OVSX_PAT }}
      TF_VAR_web_dispatch_token: ${{ secrets.WEB_DISPATCH_TOKEN || secrets.GH_ADMIN_TOKEN }}
    steps:
      - name: Operation controls at this workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: operation
          persist-credentials: false
      - name: Existing Terraform declarations from approved main
        uses: actions/checkout@v4
        with:
          ref: d48ed8ed0725b4672c1b7656c8fc4cffe452683a
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - name: Check bootstrap and authenticate the state backend
        run: |
          if [ -z "$TF_VAR_ovsx_pat" ]; then
            echo '::error::OVSX_PAT is missing from the infrastructure environment.'
            exit 1
          fi
          answer="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          if [ "$(jq -r '.result.status // empty' <<< "$answer")" != active ]; then
            echo '::error::The infrastructure token is not active.'
            exit 1
          fi
          key_id="$(jq -r '.result.id // empty' <<< "$answer")"
          if [ -z "$key_id" ]; then exit 1; fi
          secret="$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$secret"
          echo "AWS_ACCESS_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"
      - name: Remove the incidental repository and D1 dependency for this operation
        run: cp "$GITHUB_WORKSPACE/operation/scripts/ovsx-bootstrap-override.tf" ovsx_bootstrap_override.tf
      - run: terraform init -no-color -lockfile=readonly
      - name: Plan only the Open VSX secret and validate its entire scope
        run: |
          umask 077
          terraform plan -no-color -lock-timeout=5m \
            -target='github_actions_secret.release["meltemi-diagrams/OVSX_PAT"]' -out=ovsx.tfplan
          terraform show -json ovsx.tfplan | node "$GITHUB_WORKSPACE/operation/scripts/ovsx-bootstrap-plan.mjs"
      - name: Apply exactly the validated plan
        run: terraform apply -no-color -lock-timeout=5m ovsx.tfplan
      - name: Verify the targeted plan has no differences
        run: |
          umask 077
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode \
            -target='github_actions_secret.release["meltemi-diagrams/OVSX_PAT"]' -out=ovsx-verify.tfplan
          code=$?
          set -e
          if [ "$code" != 0 ]; then
            echo '::error::The Open VSX secret did not converge to an unchanged plan.'
            exit 1
          fi
          terraform show -json ovsx-verify.tfplan | node "$GITHUB_WORKSPACE/operation/scripts/ovsx-bootstrap-plan.mjs" --verify
      - name: Verify destination metadata without reading the token
        run: |
          metadata="$(gh api repos/askenaz-dev/meltemi-diagrams/actions/secrets/OVSX_PAT --jq '{name, updated_at}')"
          if [ "$(jq -r '.name' <<< "$metadata")" != OVSX_PAT ]; then exit 1; fi
          printf '%s\n' "$metadata" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove sensitive runner-local plans
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f source/packages/infra/ovsx.tfplan source/packages/infra/ovsx-verify.tfplan source/packages/infra/ovsx_bootstrap_override.tf

name: Infrastructure apply

# Temporary operation branch only. Never merge this replacement of the normal apply workflow.
# The owner first supplies WEB_DISPATCH_TOKEN in the infrastructure environment.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Preserve the production queue shared by main's Terraform apply and Wrangler deploy.
  group: production-reconciliation
  cancel-in-progress: false
  queue: max

jobs:
  apply:
    if: github.repository == 'askenaz-dev/meltemi-web' && github.ref == 'refs/heads/codex/docs-dispatch-bootstrap-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: infrastructure
    defaults:
      run:
        working-directory: source/packages/infra
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_session_private_key: ${{ secrets.SESSION_PRIVATE_KEY }}
      # The admin credential authenticates Terraform; it is never a distributed value/fallback.
      TF_VAR_narrow_web_dispatch_token: ${{ secrets.WEB_DISPATCH_TOKEN }}
    steps:
      - name: Operation controls at this workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: operation
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify the pinned main source has approved push CI and is still current
        working-directory: operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { resolveSource } from "./scripts/ci-source.mjs";
          import { githubApi } from "./scripts/github-api.mjs";
          const source = await resolveSource(
            githubApi(process.env.GITHUB_REPOSITORY, process.env.GH_TOKEN),
            process.env.GITHUB_REPOSITORY,
            "42128386923",
          );
          if (source.sha !== "8169b0c60e8ff503e721266fcfc2b6ecde8f752b" || source.current !== "true") {
            throw new Error("The pinned source is no longer current approved main; review the operation again.");
          }
          console.log("Pinned main source and its successful push CI verified.");
          NODE
      - name: Existing Terraform declarations from approved main
        uses: actions/checkout@v4
        with:
          ref: 8169b0c60e8ff503e721266fcfc2b6ecde8f752b
          path: source
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - name: Check bootstrap value and authenticate the state backend
        run: |
          if [ -z "$TF_VAR_narrow_web_dispatch_token" ]; then
            echo '::error::WEB_DISPATCH_TOKEN is missing from the infrastructure environment.'
            exit 1
          fi
          if [ "$TF_VAR_narrow_web_dispatch_token" = "$GITHUB_TOKEN" ]; then
            echo '::error::The notice token must be separate from GH_ADMIN_TOKEN.'
            exit 1
          fi
          answer="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          if [ "$(jq -r '.result.status // empty' <<< "$answer")" != active ]; then
            echo '::error::The infrastructure token is not active.'
            exit 1
          fi
          key_id="$(jq -r '.result.id // empty' <<< "$answer")"
          if [ -z "$key_id" ]; then exit 1; fi
          secret="$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$secret"
          echo "AWS_ACCESS_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"
      - name: Remove the incidental repository and D1 dependency for this operation
        run: cp "$GITHUB_WORKSPACE/operation/scripts/docs-dispatch-bootstrap-override.tf" docs_dispatch_bootstrap_override.tf
      - name: Initialize pinned providers and record runner-platform checksums
        run: |
          terraform init -no-color
          terraform version -json | jq -e '.provider_selections == {
            "registry.terraform.io/cloudflare/cloudflare": "5.28.0",
            "registry.terraform.io/hashicorp/random": "3.9.1",
            "registry.terraform.io/integrations/github": "6.13.0"
          }' > /dev/null
      - name: Plan only the documentation notice secret and validate its entire scope
        run: |
          umask 077
          terraform plan -no-color -lock-timeout=5m \
            -target='github_actions_secret.release["meltemi-diagrams/WEB_DISPATCH_TOKEN"]' -out=docs-dispatch.tfplan
          terraform show -json docs-dispatch.tfplan | node "$GITHUB_WORKSPACE/operation/scripts/docs-dispatch-bootstrap-plan.mjs"
      - name: Refuse to apply after main changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api repos/askenaz-dev/meltemi-web/git/ref/heads/main --jq .object.sha)"
          if [ "$current" != 8169b0c60e8ff503e721266fcfc2b6ecde8f752b ]; then
            echo '::error::Main changed after the operation was prepared; review its source pin again.'
            exit 1
          fi
      - name: Apply exactly the validated plan
        run: terraform apply -no-color -lock-timeout=5m docs-dispatch.tfplan
      - name: Verify the targeted plan has no differences
        run: |
          umask 077
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode \
            -target='github_actions_secret.release["meltemi-diagrams/WEB_DISPATCH_TOKEN"]' -out=docs-dispatch-verify.tfplan
          code=$?
          set -e
          if [ "$code" != 0 ]; then
            echo '::error::The documentation notice secret did not converge to an unchanged plan.'
            exit 1
          fi
          terraform show -json docs-dispatch-verify.tfplan | node "$GITHUB_WORKSPACE/operation/scripts/docs-dispatch-bootstrap-plan.mjs" --verify
      - name: Verify destination metadata without reading the token
        run: |
          metadata="$(gh api repos/askenaz-dev/meltemi-diagrams/actions/secrets/WEB_DISPATCH_TOKEN --jq '{name, updated_at}')"
          if [ "$(jq -r '.name' <<< "$metadata")" != WEB_DISPATCH_TOKEN ]; then exit 1; fi
          printf '%s\n' "$metadata" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove sensitive runner-local plans
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f source/packages/infra/docs-dispatch.tfplan source/packages/infra/docs-dispatch-verify.tfplan source/packages/infra/docs_dispatch_bootstrap_override.tf

name: Infrastructure apply

# Every push to main that changes the infrastructure applies it: the plan is made, saved and that
# very plan is applied, one run at a time. The outputs (ids, nameservers, domains; never a secret)
# are the run's summary.

on:
  push:
    branches: [main]
    paths:
      - "packages/infra/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: infrastructure
    defaults:
      run:
        working-directory: packages/infra
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_existing_secrets_store_id: ${{ vars.EXISTING_SECRETS_STORE_ID }}
      TF_VAR_existing_zone_ids: ${{ vars.EXISTING_ZONE_IDS || '{}' }}
      TF_VAR_existing_apex_record_ids: ${{ vars.EXISTING_APEX_RECORD_IDS || '{}' }}
      TF_VAR_session_private_key: ${{ secrets.SESSION_PRIVATE_KEY }}
      TF_VAR_github_client_secret: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      TF_VAR_google_client_secret: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
      TF_VAR_admin_subs: ${{ secrets.ADMIN_SUBS }}
      TF_VAR_npm_token: ${{ secrets.NPM_TOKEN }}
      TF_VAR_vsce_pat: ${{ secrets.VSCE_PAT }}
      TF_VAR_ovsx_pat: ${{ secrets.OVSX_PAT }}
      # The narrow notice token when it exists; until then the admin token, by the owner's choice
      # of 2026-10-23 (change ide-releases, design: "The owner's choice").
      TF_VAR_web_dispatch_token: ${{ secrets.WEB_DISPATCH_TOKEN || secrets.GH_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - name: The Cloudflare token and the state bucket, as this runner sees them
        run: |
          answer="$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          status="$(echo "$answer" | jq -r '.result.status // empty')"
          if [ "$status" != "active" ]; then
            echo "::error::Cloudflare refuses the token from this runner: $(echo "$answer" | jq -c '.errors')."
            echo "A token restricted to some client IP addresses cannot be used from GitHub's runners."
            exit 1
          fi
          account="$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts" | jq -c '.success, .errors')"
          echo "An account call from this runner answers: $account"
          # R2's S3 credentials are the token's id and the SHA-256 of its value (Cloudflare's R2 docs),
          # derived here so that they always belong to the token the environment holds.
          key_id="$(echo "$answer" | jq -r '.result.id')"
          secret="$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$secret"
          echo "AWS_ACCESS_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"
          if AWS_ACCESS_KEY_ID="$key_id" AWS_SECRET_ACCESS_KEY="$secret" aws s3api list-objects-v2 \
            --bucket meltemi-terraform-state --endpoint-url "$AWS_ENDPOINT_URL_S3" --region auto --max-items 1 > /dev/null; then
            echo "The token is active and R2 accepts the state bucket's credentials."
          else
            echo "::error::R2 refuses the state bucket's credentials derived from the token (it needs Workers R2 Storage)."
            exit 1
          fi
      - run: terraform init
      - name: Plan
        run: terraform plan -no-color -lock-timeout=5m -out=apply.tfplan
      - name: Apply that plan
        run: terraform apply -no-color -lock-timeout=5m apply.tfplan
      - name: Outputs
        run: |
          {
            echo "### Outputs"
            echo
            echo '```json'
            terraform output -json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

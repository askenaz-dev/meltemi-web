name: Infrastructure drift

# Once a week the cloud is compared with the code. A difference (a record changed in a dashboard,
# a secret removed by hand) opens the issue "Infrastructure drift" with the plan that would undo
# it, or updates the open one; no difference closes it.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: infrastructure
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    environment: infrastructure
    defaults:
      run:
        working-directory: packages/infra
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_existing_secrets_store_id: ${{ vars.EXISTING_SECRETS_STORE_ID }}
      TF_VAR_existing_zone_ids: ${{ vars.EXISTING_ZONE_IDS || '{}' }}
      TF_VAR_existing_apex_record_ids: ${{ vars.EXISTING_APEX_RECORD_IDS || '{}' }}
      TF_VAR_session_private_key: ${{ secrets.SESSION_PRIVATE_KEY }}
      TF_VAR_github_client_secret: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      TF_VAR_google_client_secret: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
      TF_VAR_admin_subs: ${{ secrets.ADMIN_SUBS }}
      TF_VAR_npm_token: ${{ secrets.NPM_TOKEN }}
      TF_VAR_vsce_pat: ${{ secrets.VSCE_PAT }}
      TF_VAR_ovsx_pat: ${{ secrets.OVSX_PAT }}
      TF_VAR_web_dispatch_token: ${{ secrets.WEB_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - name: The Cloudflare token and the state bucket, as this runner sees them
        run: |
          answer="$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          status="$(echo "$answer" | jq -r '.result.status // empty')"
          if [ "$status" != "active" ]; then
            echo "::error::Cloudflare refuses the token from this runner: $(echo "$answer" | jq -c '.errors')."
            echo "A token restricted to some client IP addresses cannot be used from GitHub's runners."
            exit 1
          fi
          account="$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts" | jq -c '.success, .errors')"
          echo "An account call from this runner answers: $account"
          # R2's S3 credentials are the token's id and the SHA-256 of its value (Cloudflare's R2 docs),
          # derived here so that they always belong to the token the environment holds.
          key_id="$(echo "$answer" | jq -r '.result.id')"
          secret="$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$secret"
          echo "AWS_ACCESS_KEY_ID=$key_id" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$secret" >> "$GITHUB_ENV"
          if AWS_ACCESS_KEY_ID="$key_id" AWS_SECRET_ACCESS_KEY="$secret" aws s3api list-objects-v2 \
            --bucket meltemi-terraform-state --endpoint-url "$AWS_ENDPOINT_URL_S3" --region auto --max-items 1 > /dev/null; then
            echo "The token is active and R2 accepts the state bucket's credentials."
          else
            echo "::error::R2 refuses the state bucket's credentials derived from the token (it needs Workers R2 Storage)."
            exit 1
          fi
      - run: terraform init
      - name: Compare
        id: compare
        run: |
          set +e
          terraform plan -no-color -lock-timeout=5m -detailed-exitcode -out=drift.tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          # 0: no difference; 2: a difference; anything else: the plan failed.
          if [ "$code" != 0 ] && [ "$code" != 2 ]; then exit "$code"; fi
          if [ "$code" = 2 ]; then
            # The provider's noise is not drift: an update whose known values all equal the
            # state's (scripts/plan-changes.mjs). The JSON holds secrets in clear and never leaves
            # the runner; the script prints addresses and attribute names only.
            terraform show -json drift.tfplan > drift.json
            set +e
            node scripts/plan-changes.mjs drift.json | tee -a plan.txt
            code=${PIPESTATUS[0]}
            set -e
            rm -f drift.json
            if [ "$code" != 0 ] && [ "$code" != 2 ]; then exit "$code"; fi
          fi
          rm -f drift.tfplan
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: The drift issue
        uses: actions/github-script@v7
        env:
          CODE: ${{ steps.compare.outputs.code }}
        with:
          script: |
            const fs = require("node:fs");
            const title = "Infrastructure drift";
            const { owner, repo } = context.repo;
            const open = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open" }))
              .find((issue) => issue.title === title && !issue.pull_request);
            if (process.env.CODE === "2") {
              const text = fs.readFileSync("packages/infra/plan.txt", "utf8");
              const shown = text.length > 60000 ? `…\n${text.slice(-60000)}` : text;
              const body = `The cloud differs from \`packages/infra\`. Applying \`main\` again undoes the difference; a change that should stay belongs in the code.\n\n\`\`\`\n${shown}\n\`\`\``;
              if (open) await github.rest.issues.update({ owner, repo, issue_number: open.number, body });
              else await github.rest.issues.create({ owner, repo, title, body });
            } else if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: "No difference any more." });
              await github.rest.issues.update({ owner, repo, issue_number: open.number, state: "closed" });
            }

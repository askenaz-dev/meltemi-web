name: CI

# Every push to main and every pull request: the types, the style, the build and the tests of the
# whole workspace, the site in a browser, and the infrastructure's own checks. Nothing here
# deploys, publishes or reads a secret.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  browser:
    name: The site in Chrome (pnpm site:browser)
    # The pages in the runner's installed Chrome, served by wrangler dev on 127.0.0.1: no console
    # error, no policy violation, no request beyond the runner, and the motion of site-motion.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm site:browser

  infrastructure:
    name: Terraform (formatting, validity, tests with mocked providers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false
      - name: Formatting
        working-directory: packages/infra
        run: terraform fmt -check -recursive
      - name: Providers (no backend, no credentials)
        working-directory: packages/infra
        run: terraform init -backend=false -input=false
      - name: Validity
        working-directory: packages/infra
        run: terraform validate
      - name: The stages, planned against mocked providers
        working-directory: packages/infra
        run: terraform test

name: Release

# automatic-main-releases: approved source gets deterministic versions, without a bot commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful push/main CI run to recover
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  source:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .automation
          persist-credentials: false
      - name: Validate the CI run through GitHub
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
        run: node .automation/scripts/ci-source.mjs resolve

  prepare:
    needs: source
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .automation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - name: Reserve source tags and stamp the packaging checkout
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          CI_RUN_ID: ${{ needs.source.outputs.ci_run_id }}
        run: node ../.automation/scripts/release-main.mjs reserve
      - run: pnpm build
        working-directory: source
      - name: Pack once
        working-directory: source
        run: node ../.automation/scripts/release-main.mjs pack
      - name: Name this build artifact for retry-safe publication
        id: artifact
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: echo "name=release-$SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: source/release/
          if-no-files-found: error
          retention-days: 90

  npm:
    needs: [source, prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [identity, ocean]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .automation
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish or verify npm, without moving latest backwards
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE: ${{ matrix.package }}
        run: node .automation/scripts/release-main.mjs npm "$PACKAGE"

  github:
    needs: [source, prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [identity, ocean]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .automation
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: release
      - name: Publish or verify the GitHub release independently of npm
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
        run: node .automation/scripts/release-main.mjs github "$PACKAGE"

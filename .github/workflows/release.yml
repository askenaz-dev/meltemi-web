name: Release

# A tag v<x.y.z> publishes @meltemi/identity at that version to npm, with provenance, and creates
# the GitHub release. The first job refuses a tag that does not name the package's version, before
# anything is published; a run re-run after a partial failure skips what npm already has.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the package's version
        run: node scripts/release-tag.mjs "$GITHUB_REF_NAME" packages/identity/package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meltemi/identity run build
      - name: Publish @meltemi/identity
        working-directory: packages/identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@meltemi/identity@${version}" version >/dev/null 2>&1; then
            echo "@meltemi/identity@${version} is already on npm"
          else
            npm publish --access public --provenance
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Meltemi Web $GITHUB_REF_NAME"
          fi
